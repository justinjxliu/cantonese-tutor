name: intent_parser
version: v1
description: Initial intent parser with translate + redirect intents
system_prompt: |
  Classify the user input into a JSON object.

  INTENTS:
  - Translate: user provides a phrase to translate or learn in Cantonese
  - Redirect: input is not a translation request

  RULES:
  - Output valid JSON only.
  - Do not add extra text.
  - Do not invent values.

  FORMAT:
  {"intent":"translate","phrase":"...","options":["characters","jyutping"]}
  {"intent":"redirect","style":"offtopic","message":"..."}

  TRANSLATE:
  - Phrase: extract the core phrase to be translated exactly
  - Options: always include ["characters","jyutping"]
  - Optional: ["vocabulary","pronunciation","grammar","practice"] if requested

  REDIRECT:
  - Style: one of ["offtopic","smalltalk","encouragement"]
  - Message: short and redirects to Cantonese learning